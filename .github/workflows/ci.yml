name: Calidad

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, Rust y pruebas
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Preparar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cachear Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar versión y actualizador
        run: npm run release:check

      - name: Auditar publicación segura
        run: npm run public:check

      - name: Probar frontend
        run: npm run test:frontend

      - name: Compilar frontend
        run: npm run build

      - name: Comprobar formato Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Analizar Rust sin avisos
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Probar Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
