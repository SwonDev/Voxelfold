[package]
name = "voxelfold"
version = "0.2.0"
description = "Voxelfold — guías de construcción paso a paso para Hytale (herramienta no oficial)"
authors = ["Voxelfold"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# El sufijo `_lib` evita conflicto entre el nombre de la lib y el del binario (issue de Windows).
name = "voxelfold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Core de Voxelfold:
zip = "2"          # lectura por entrada del Assets.zip de Hytale (sin extraer 3.4 GB)
thiserror = "2"    # tipos de error del Core
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }  # SQLite incrustado
rusqlite_migration = "1.3"  # migraciones versionadas
urlencoding = "2"  # decodificar rutas del custom protocol voxelfold-asset://
ureq = "3"         # cliente HTTP (búsqueda de prefabs públicos de la comunidad, sin servidor propio)
keyring = "4.1.5"  # secretos del usuario en Keychain/Credential Manager/Secret Service
url = "2"          # validación estricta de URLs remotas antes de descargar
